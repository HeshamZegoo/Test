<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نموذج رسالة البلاغ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#ffffff;--ink:#14202b;--mute:#5b6875;--line:#d5dbe1;--acc:#1b4f72;--acc-ink:#ffffff;--acc-soft:#dbe9f4;--warn:#8a5a00;--warn-soft:#fbecc8;--crit:#9b1c1c;--crit-soft:#fadcdc;--bub:#2c6bed;--bub-ink:#ffffff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--card:#18222c;--ink:#e8edf2;--mute:#9aa8b5;--line:#2b3947;--acc:#7fb4de;--acc-ink:#0f161d;--acc-soft:#1f3b52;--warn:#f1c35f;--warn-soft:#4a3a12;--crit:#f4a1a1;--crit-soft:#521d1d;--bub:#3b7bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161d;--card:#18222c;--ink:#e8edf2;--mute:#9aa8b5;--line:#2b3947;--acc:#7fb4de;--acc-ink:#0f161d;--acc-soft:#1f3b52;--warn:#f1c35f;--warn-soft:#4a3a12;--crit:#f4a1a1;--crit-soft:#521d1d;--bub:#3b7bff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.7}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:700;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label,.lb{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px}
.lb:first-child{margin-top:0}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.seg{display:flex;gap:8px}
.seg button{flex:1}
button{font:inherit;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;padding:8px 12px}
.seg button[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:700}
.seg button.w[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg button.c[aria-pressed="true"]{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.err{color:var(--crit);font-size:14px;margin-top:4px;min-height:0}
.prev-h{font-size:14px;color:var(--mute);margin:0 0 8px}
.chat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.chat-h{font-size:14px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.chat-h span{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.bub{background:var(--bub);color:var(--bub-ink);border-radius:14px;padding:10px 14px;white-space:pre-wrap;line-height:1.9;font-size:15px;max-width:94%}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1}
.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
#st{font-size:14px;color:var(--mute);min-height:22px;margin-top:8px}
.note{font-size:13px;color:var(--mute);margin:0}
</style>
</head>
<body>
<main>
<h1>نموذج رسالة البلاغ</h1>
<p class="sub">املا الحقول، انسخ الرسالة، والصقها في جروب Signal.</p>

<section class="card" aria-label="بيانات البلاغ">
  <span class="lb" id="l-type">نوع البلاغ</span>
  <div class="seg" id="type" role="group" aria-labelledby="l-type">
    <button type="button" data-v="حادث" aria-pressed="true">حادث</button>
    <button type="button" data-v="حريق" aria-pressed="false">حريق</button>
    <button type="button" data-v="جريمة" aria-pressed="false">جريمة</button>
  </div>

  <label for="loc">المكان</label>
  <input id="loc" type="text" autocomplete="off" placeholder="شارع النيل، أمام مبنى 12">
  <div class="err" id="e1" role="alert"></div>

  <label for="tm">الوقت</label>
  <input id="tm" type="datetime-local">

  <span class="lb" id="l-sev">الخطورة</span>
  <div class="seg" id="sev" role="group" aria-labelledby="l-sev">
    <button type="button" data-v="عادي" aria-pressed="true">عادي</button>
    <button type="button" class="w" data-v="عاجل" aria-pressed="false">عاجل</button>
    <button type="button" class="c" data-v="حرج" aria-pressed="false">حرج</button>
  </div>

  <label for="det">التفاصيل</label>
  <textarea id="det" rows="4" placeholder="وصف مختصر، بدون أسماء كاملة أو أرقام قومية"></textarea>
  <div class="err" id="e2" role="alert"></div>

  <label for="rep">المبلّغ (رمز أو رقم فقط)</label>
  <input id="rep" type="text" autocomplete="off" placeholder="ض-07">
</section>

<section class="card" aria-label="معاينة الرسالة">
  <p class="prev-h">كده هتظهر الرسالة في الجروب</p>
  <div class="chat">
    <div class="chat-h" id="gname">جروب: حوادث<span>رسائل مشفرة وتختفي تلقائيًا</span></div>
    <div class="bub" id="bub"></div>
  </div>
  <div class="row">
    <button type="button" class="pri" id="cp">نسخ الرسالة</button>
    <button type="button" id="sh" hidden>مشاركة</button>
  </div>
  <div id="st" role="status"></div>
</section>

<p class="note">النموذج لا يحفظ ولا يرسل أي بيانات. كل ما تكتبه يبقى على موبايلك حتى تلصقه في الجروب.</p>
</main>
<script>
var T="حادث",S="عادي";
function $(i){return document.getElementById(i)}
function pad(n){return n<10?"0"+n:""+n}
function nowVal(){var n=new Date();return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())+"T"+pad(n.getHours())+":"+pad(n.getMinutes())}
$("tm").value=nowVal();
function fmt(v){if(!v)return"...";var p=v.split("T");return p[0].replace(/-/g,"/")+"  "+p[1]}
function build(){
  var l=$("loc").value.trim()||"...",d=$("det").value.trim()||"...",r=$("rep").value.trim()||"...";
  return "بلاغ: "+T+"\nالمكان: "+l+"\nالوقت: "+fmt($("tm").value)+"\nالخطورة: "+S+"\nالتفاصيل: "+d+"\nالمبلّغ: "+r;
}
var G={"حادث":"حوادث","حريق":"حرائق","جريمة":"جرائم"};
function render(){
  $("bub").textContent=build();
  $("gname").firstChild.nodeValue="جروب: "+G[T];
}
function seg(id,cb){
  var bs=document.querySelectorAll("#"+id+" button");
  bs.forEach(function(b){b.addEventListener("click",function(){
    bs.forEach(function(x){x.setAttribute("aria-pressed","false")});
    b.setAttribute("aria-pressed","true");cb(b.getAttribute("data-v"));render();
  })});
}
seg("type",function(v){T=v});seg("sev",function(v){S=v});
["loc","tm","det","rep"].forEach(function(i){$(i).addEventListener("input",function(){
  $("e1").textContent="";$("e2").textContent="";render();
})});
function valid(){
  var ok=true;
  if(!$("loc").value.trim()){$("e1").textContent="اكتب المكان أولًا";ok=false}
  if(!$("det").value.trim()){$("e2").textContent="اكتب التفاصيل أولًا";ok=false}
  return ok;
}
$("cp").addEventListener("click",function(){
  if(!valid())return;
  var txt=build(),st=$("st");
  function fb(){
    var a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();
    var s=false;try{s=document.execCommand("copy")}catch(e){}
    document.body.removeChild(a);
    st.textContent=s?"تم النسخ. الصقها في جروب Signal.":"انسخ النص من المعاينة يدويًا.";
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){st.textContent="تم النسخ. الصقها في جروب Signal."},fb);
  }else{fb()}
});
if(navigator.share){
  $("sh").hidden=false;
  $("sh").addEventListener("click",function(){
    if(!valid())return;
    navigator.share({text:build()}).catch(function(){});
  });
}
render();
</script>
</body>
</html>
